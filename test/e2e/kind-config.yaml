# The e2e kind cluster. ImageVolume lets the CI pod mount the credential
# helper image as a volume, as the admin guide sets it up.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  ImageVolume: true
nodes:
  - role: control-plane
# Pull the cluster's images in parallel. The default pulls one at a time,
# which is slow when every image comes through the proxy.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    serializeImagePulls: false
