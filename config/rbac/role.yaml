---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - registrygate.soliddowant.dev
  resources:
  - registryaccesspolicies
  - registrymirrors
  - upstreamcredentials
  - upstreamregistries
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - registrygate.soliddowant.dev
  resources:
  - registryaccesspolicies/status
  - registrymirrors/status
  - upstreamcredentials/status
  - upstreamregistries/status
  verbs:
  - patch
  - update
