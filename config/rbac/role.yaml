---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - registrygate.soliddowant.dev
  resources:
  - ghcraccesspolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - registrygate.soliddowant.dev
  resources:
  - ghcraccesspolicies/status
  verbs:
  - update
