# -- Number of proxy replicas. Every replica serves requests.
replicas: 2
image:
  # -- Proxy image repository.
  repository: ghcr.io/soliddowant/registrygate
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# -- Names of image pull Secrets.
imagePullSecrets: []
# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""
crds:
  # -- Install the CRDs with the chart. Set to false when you manage them yourself.
  install: true
pat:
  # -- Name of the Secret that holds the GitHub personal access token. Required. The chart never creates it.
  existingSecret: ""
  # -- Key in that Secret that holds the token.
  key: token
tls:
  # -- Name of the `kubernetes.io/tls` Secret with the serving certificate. Required. The chart never creates it.
  existingSecret: ""
uploadSigning:
  # -- Name of a Secret in the release namespace whose key `key` (at least 32 bytes) signs upload session tokens. Empty makes the chart create one with a random key and keep it across upgrades.
  existingSecret: ""
webhook:
  # -- Serve the validating admission webhook that rejects an `UpstreamRegistry` outside the admin namespaces, and a `RegistryAccessPolicy` rule outside the ceiling of its credential, at apply time. The proxy still enforces both either way.
  enabled: false
  # -- Name of the `kubernetes.io/tls` Secret with the webhook's serving certificate. Required when the webhook is on and `webhook.certManager.issuerRef.name` is empty. The chart never creates it.
  existingSecret: ""
  # -- Base64 CA bundle that signed the webhook certificate. Required when you provide `webhook.existingSecret`.
  caBundle: ""
  certManager:
    issuerRef:
      # -- Name of a cert-manager Issuer or ClusterIssuer. When set, the chart makes the certificate and cainjector adds the CA bundle (cainjector must run).
      name: ""
      # -- Kind of the issuer.
      kind: Issuer
      # -- API group of the issuer.
      group: cert-manager.io
service:
  # -- Fixed ClusterIP of the Service. Pin it so CI pods can map `ghcr.io` to it with `hostAliases`. Empty lets Kubernetes choose.
  clusterIP: ""
upstream:
  # -- Upstream registry URL.
  url: https://ghcr.io
  # -- Extra hosts allowed as token realms. The upstream host is always allowed.
  tokenHosts: []
  ca:
    # -- Name of a Secret with an extra CA certificate (PEM) to trust for the upstream, next to the system roots. Only for a private or test upstream; leave empty for `ghcr.io`.
    existingSecret: ""
    # -- Key in that Secret that holds the CA certificate.
    key: ca.crt
  # -- Timeout of one whole upstream request. Uploads of several GB must fit.
  timeout: 30m
  # -- Timeout of one upstream token exchange.
  tokenTimeout: 10s
  # -- GitHub REST API URL. Deletes by digest delete the package version through this API with the PAT. Uses the upstream CA when set.
  apiURL: https://api.github.com/
mirrors:
  policy:
    # -- URL of the policy pull mirror, with a scheme, a host and an optional port only. Empty turns this mirror off. Allowed pulls of manifests and blobs go to this mirror.
    url: ""
    # -- Path under which the mirror serves GHCR's repositories. The mirror name of `owner/image` is `<pathPrefix>/owner/image`.
    pathPrefix: ""
    credentials:
      # -- Name of a Secret with the mirror's own credentials as `user:password`. Empty means the proxy connects to the mirror with no credentials. Never put the PAT here.
      existingSecret: ""
      # -- Key in that Secret that holds the credentials.
      key: credentials
    ca:
      # -- Name of a Secret with an extra CA certificate (PEM) to trust for the mirror, next to the system roots.
      existingSecret: ""
      # -- Key in that Secret that holds the CA certificate.
      key: ca.crt
    # -- Send the pull to the upstream when the mirror fails.
    fallbackToUpstream: true
    # -- How long the proxy waits for the mirror's response headers before it counts the mirror as failed.
    responseHeaderTimeout: 10s
  anonymous:
    # -- URL of the anonymous pull mirror, with a scheme, a host and an optional port only. Empty turns this mirror off. Anonymous and not-allowed pulls of manifests and blobs go to this mirror. It must have no upstream credentials, because anyone who can reach the proxy can read through it.
    url: ""
    # -- Path under which the mirror serves GHCR's repositories. The mirror name of `owner/image` is `<pathPrefix>/owner/image`.
    pathPrefix: ""
    credentials:
      # -- Name of a Secret with the mirror's own credentials as `user:password`. Empty means the proxy connects to the mirror with no credentials. Never put the PAT here.
      existingSecret: ""
      # -- Key in that Secret that holds the credentials.
      key: credentials
    ca:
      # -- Name of a Secret with an extra CA certificate (PEM) to trust for the mirror, next to the system roots.
      existingSecret: ""
      # -- Key in that Secret that holds the CA certificate.
      key: ca.crt
    # -- Send the pull to the upstream when the mirror fails.
    fallbackToUpstream: true
    # -- How long the proxy waits for the mirror's response headers before it counts the mirror as failed.
    responseHeaderTimeout: 10s
authentication:
  # -- Audience that ServiceAccount tokens must carry.
  audience: registrygate
  # -- How long a token review result is cached (1s to 30s).
  cacheTTL: 30s
  # -- Timeout of one token review.
  reviewTimeout: 5s
# -- Grants that cap what policies in each namespace may allow. Each has a `namespaces` regular expression, `repositories` globs and `actions`.
grants: []
server:
  # -- Timeout for reading request headers.
  readHeaderTimeout: 10s
  # -- Idle timeout of keep-alive connections.
  idleTimeout: 120s
  # -- Largest accepted request header size in bytes.
  maxHeaderBytes: 65536
  # -- How long in-flight requests may finish after SIGTERM. The pod's termination grace period is this plus 30 seconds.
  shutdownGracePeriod: 10m
audit:
  # -- Write one audit log line per decision.
  enabled: true
serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the full name.
  name: ""
  # -- Annotations for the ServiceAccount.
  annotations: {}
resources:
  requests:
    # -- CPU request. There is no CPU limit.
    cpu: 100m
    # -- Memory request.
    memory: 256Mi
  limits:
    # -- Memory limit. Keep it equal to the memory request.
    memory: 256Mi
podSecurityContext:
  # -- Run the pod as a non-root user.
  runAsNonRoot: true
  # -- User ID of the pod (the distroless nonroot user).
  runAsUser: 65532
  # -- Group ID of the pod.
  runAsGroup: 65532
  seccompProfile:
    # -- Seccomp profile of the pod.
    type: RuntimeDefault
securityContext:
  # -- Allow privilege escalation in the container.
  allowPrivilegeEscalation: false
  # -- Mount the container's root filesystem read-only.
  readOnlyRootFilesystem: true
  capabilities:
    # -- Linux capabilities dropped from the container.
    drop: ["ALL"]
# -- Pod annotations.
podAnnotations: {}
# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
podDisruptionBudget:
  # -- Create a PodDisruptionBudget. With `replicas: 1` and `maxUnavailable: 1` it allows full disruption, so a drain can take the only replica down.
  enabled: false
  # -- Number of pods that may be down during a voluntary disruption.
  maxUnavailable: 1
networkPolicy:
  # -- Create a NetworkPolicy. Ports match the destination pod's port after Service translation (the Service's port 443 is the pod's 8443), not the Service port. The policy needs a CNI that enforces NetworkPolicy.
  enabled: false
  # -- Namespaces whose pods may connect to port 8443 (the registry). The default matches every namespace; narrow it, for example with `matchLabels`.
  clientNamespaceSelector: {}
  # -- Namespaces whose pods may scrape port 8080 (health and metrics), such as the monitoring namespace. The default matches every namespace.
  metricsNamespaceSelector: {}
  # -- CIDRs of the Kubernetes API server. They may reach port 9443 (the admission webhook) and the proxy may reach them on `apiServerPorts`. Without them, the proxy cannot reach the API server for token reviews. Use the addresses of `kubectl get endpoints kubernetes`, because the NetworkPolicy sees the address after Service translation.
  apiServerCIDRs: []
  # -- Ports of the API server, after Service translation.
  apiServerPorts: [443, 6443]
  # -- Extra raw egress rules (NetworkPolicy `egress` items), for example for an in-cluster upstream or mirror. Port 443 to any address is always allowed.
  extraEgress: []
serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor for the metrics port. Needs the ServiceMonitor CRD.
  enabled: false
  # -- Scrape interval.
  interval: 30s
  # -- Extra labels on the ServiceMonitor, for example the label your Prometheus selects on.
  labels: {}
