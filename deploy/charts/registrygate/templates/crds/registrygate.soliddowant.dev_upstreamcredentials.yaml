{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: upstreamcredentials.registrygate.soliddowant.dev
spec:
  group: registrygate.soliddowant.dev
  names:
    categories:
    - registrygate
    kind: UpstreamCredential
    listKind: UpstreamCredentialList
    plural: upstreamcredentials
    singular: upstreamcredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UpstreamCredential is a shared credential for an upstream with
          a ceiling on what rules may do with it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UpstreamCredentialSpec is a shared credential for an upstream,
              capped by a ceiling.
            properties:
              allowedNamespaces:
                description: AllowedNamespaces may use this credential in policy rules.
                properties:
                  names:
                    description: Names of allowed namespaces.
                    items:
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                  selector:
                    description: Selector allows every namespace whose labels match.
                      An empty selector allows every namespace.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              ceiling:
                description: Ceiling is the most any rule using this credential may
                  allow.
                items:
                  description: AccessGrant is a set of actions on the repositories
                    its globs match.
                  properties:
                    actions:
                      description: Actions allowed on those repositories.
                      items:
                        description: Action is a registry action a rule allows.
                        enum:
                        - pull
                        - push
                        - delete
                        type: string
                      maxItems: 3
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    repositories:
                      description: Repositories are glob patterns of repository names,
                        without the registry host.
                      items:
                        maxLength: 255
                        minLength: 1
                        type: string
                      maxItems: 32
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                      x-kubernetes-validations:
                      - message: each repository pattern must be lower-case segments
                          of [a-z0-9._-] and *, separated by /, with ** only as a
                          whole segment
                        rule: self.all(p, p.matches('^(\\*\\*|\\*|\\*?([a-z0-9._-]+\\*?)+)(/(\\*\\*|\\*|\\*?([a-z0-9._-]+\\*?)+))*$'))
                  required:
                  - actions
                  - repositories
                  type: object
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              secretRef:
                description: SecretRef is the Secret with the username and password.
                properties:
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  passwordKey:
                    description: PasswordKey is the Secret key of the password. Default
                      "password".
                    maxLength: 253
                    type: string
                  usernameKey:
                    description: UsernameKey is the Secret key of the username. Default
                      "username".
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
              upstreamRef:
                description: UpstreamRef is the upstream this credential is for.
                properties:
                  name:
                    description: Name of the object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: Namespace of the object. Defaults to the namespace
                      of the referring object.
                    maxLength: 63
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$
                    type: string
                required:
                - name
                type: object
            required:
            - ceiling
            - secretRef
            - upstreamRef
            type: object
          status:
            description: |-
              RegistryStatus is the observed state of an UpstreamRegistry, UpstreamCredential or RegistryMirror.
              Only the proxy writes it.
            properties:
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last generation the proxy computed
                  this status for.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
