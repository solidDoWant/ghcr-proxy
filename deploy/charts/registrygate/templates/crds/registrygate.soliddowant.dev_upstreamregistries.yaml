{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: upstreamregistries.registrygate.soliddowant.dev
spec:
  group: registrygate.soliddowant.dev
  names:
    categories:
    - registrygate
    kind: UpstreamRegistry
    listKind: UpstreamRegistryList
    plural: upstreamregistries
    singular: upstreamregistry
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UpstreamRegistry is a registry the proxy fronts. Only admin namespaces
          may hold one.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UpstreamRegistrySpec says which hosts the proxy answers for
              and where their requests go.
            properties:
              aliasHosts:
                description: |-
                  AliasHosts are other names (host or host:port) of the registry at url, such as Harbor's externalURL when url is
                  its in-cluster Service. A token realm or Location on an alias host is treated as on url; the proxy never sends
                  a request to an alias host.
                items:
                  maxLength: 260
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*(:[0-9]{1,5})?$
                  type: string
                maxItems: 8
                type: array
                x-kubernetes-list-type: set
              allowedMirrorURLs:
                description: AllowedMirrorURLs are the URL prefixes a mirror of this
                  upstream may use.
                items:
                  maxLength: 2048
                  type: string
                  x-kubernetes-validations:
                  - message: must be an http(s) URL prefix with no userinfo, query,
                      fragment, %, empty or dot segments
                    rule: self.matches('^https?://[^/?#@%]+(/[^/?#%]+)*/?$') && !self.matches('/\\.\\.?(/|$)')
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              allowedNamespaces:
                description: AllowedNamespaces may point credentials, mirrors and
                  policies at this upstream.
                properties:
                  names:
                    description: Names of allowed namespaces.
                    items:
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                  selector:
                    description: Selector allows every namespace whose labels match.
                      An empty selector allows every namespace.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              anonymousPulls:
                description: AnonymousPulls says what happens to an unauthenticated
                  pull. Default Challenge.
                enum:
                - Challenge
                - Forward
                type: string
              caSecretRef:
                description: CASecretRef names the Secret (key ca.crt) with the CA
                  that signs the upstream.
                properties:
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              defaultMirrorRef:
                description: DefaultMirrorRef is the mirror that serves pulls no rule
                  decides.
                properties:
                  name:
                    description: Name of the object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: Namespace of the object. Defaults to the namespace
                      of the referring object.
                    maxLength: 63
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$
                    type: string
                required:
                - name
                type: object
              hosts:
                description: Hosts are the DNS names the proxy answers for.
                items:
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              timeouts:
                description: Timeouts of calls to the upstream.
                properties:
                  responseHeader:
                    description: ResponseHeader is the time from the request being
                      sent to the response headers arriving. Default 30s.
                    type: string
                  token:
                    description: Token is the time for the ping and the token exchange
                      together. Default 10s.
                    type: string
                type: object
              tls:
                description: TLS is the serving certificate.
                properties:
                  secretRef:
                    description: SecretRef is the Secret with the serving key pair.
                    properties:
                      name:
                        description: Name of the Secret.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
              tokenRealmHosts:
                description: TokenRealmHosts are hosts (host or host:port) allowed
                  as the token endpoint besides the url host.
                items:
                  maxLength: 260
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*(:[0-9]{1,5})?$
                  type: string
                maxItems: 8
                type: array
                x-kubernetes-list-type: set
              url:
                description: 'URL is where requests go: https://host[:port], or http://host[:port]
                  for plain HTTP (no caSecretRef).'
                maxLength: 2048
                type: string
            required:
            - hosts
            - tls
            - url
            type: object
            x-kubernetes-validations:
            - message: url must be http(s)://host[:port] with no path, query or userinfo
              rule: self.url.matches('^https?://[^/?#@]+$')
          status:
            description: |-
              RegistryStatus is the observed state of an UpstreamRegistry, UpstreamCredential or RegistryMirror.
              Only the proxy writes it.
            properties:
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last generation the proxy computed
                  this status for.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
