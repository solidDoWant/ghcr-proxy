# The proxy reads Secrets in its own namespace, the admin namespace: the serving certificates, upstream and mirror
# credentials, and the upload signing key.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "registrygate.fullname" . }}-secrets
  labels:
    {{- include "registrygate.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "registrygate.fullname" . }}-secrets
  labels:
    {{- include "registrygate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "registrygate.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "registrygate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
