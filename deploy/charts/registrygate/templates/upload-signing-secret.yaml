{{- if not .Values.uploadSigning.existingSecret }}
{{- $name := include "registrygate.uploadSigningSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "registrygate.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "key") }}
  # Keep the key across upgrades: a new key would fail every upload in flight.
  key: {{ index $existing.data "key" }}
  {{- else }}
  key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- end }}
