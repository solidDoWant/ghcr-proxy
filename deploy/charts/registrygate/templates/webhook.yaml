{{- if .Values.webhook.enabled }}
{{- $name := printf "%s-webhook" (include "registrygate.fullname" .) }}
{{- $issuer := .Values.webhook.certManager.issuerRef }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "registrygate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # A replica that is not ready still answers admission requests, which need only the config and the certificate.
  publishNotReadyAddresses: true
  selector:
    {{- include "registrygate.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
---
{{- if $issuer.name }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}
  labels:
    {{- include "registrygate.labels" . | nindent 4 }}
spec:
  secretName: {{ include "registrygate.webhookSecretName" . }}
  dnsNames:
    - {{ $name }}.{{ .Release.Namespace }}.svc
    - {{ $name }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ $issuer.name }}
    kind: {{ $issuer.kind }}
    group: {{ $issuer.group }}
---
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $name }}
  labels:
    {{- include "registrygate.labels" . | nindent 4 }}
  {{- if $issuer.name }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $name }}
  {{- end }}
webhooks:
  - name: upstreamregistries.registrygate.soliddowant.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: {{ $name }}
        namespace: {{ .Release.Namespace }}
        path: /validate-upstreamregistry
        port: 443
      {{- if not $issuer.name }}
      caBundle: {{ required "webhook.caBundle is required when you provide webhook.existingSecret" .Values.webhook.caBundle | quote }}
      {{- end }}
    rules:
      - apiGroups: ["registrygate.soliddowant.dev"]
        apiVersions: ["v1alpha1"]
        resources: ["upstreamregistries"]
        operations: ["CREATE", "UPDATE"]
  - name: registryaccesspolicies.registrygate.soliddowant.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: {{ $name }}
        namespace: {{ .Release.Namespace }}
        path: /validate-registryaccesspolicy
        port: 443
      {{- if not $issuer.name }}
      caBundle: {{ required "webhook.caBundle is required when you provide webhook.existingSecret" .Values.webhook.caBundle | quote }}
      {{- end }}
    rules:
      - apiGroups: ["registrygate.soliddowant.dev"]
        apiVersions: ["v1alpha1"]
        resources: ["registryaccesspolicies"]
        operations: ["CREATE", "UPDATE"]
{{- end }}
