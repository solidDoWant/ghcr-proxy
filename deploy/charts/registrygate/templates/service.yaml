apiVersion: v1
kind: Service
metadata:
  name: {{ include "registrygate.fullname" . }}
  labels:
    {{- include "registrygate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "registrygate.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: metrics
      port: 8080
      targetPort: health
