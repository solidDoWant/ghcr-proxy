# -- Number of proxy replicas. Every replica serves requests.
replicas: 2
image:
  # -- Proxy image repository.
  repository: ghcr.io/soliddowant/ghcr-proxy
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# -- Names of image pull Secrets.
imagePullSecrets: []
# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""
crds:
  # -- Install the CRDs with the chart. Set to false when you manage them yourself.
  install: true
serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the full name.
  name: ""
  # -- Annotations for the ServiceAccount.
  annotations: {}
resources:
  requests:
    # -- CPU request. There is no CPU limit.
    cpu: 100m
    # -- Memory request.
    memory: 128Mi
  limits:
    # -- Memory limit. Keep it equal to the memory request.
    memory: 128Mi
# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
# -- Container security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
# -- Pod annotations.
podAnnotations: {}
# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
