{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: ghcraccesspolicies.ghcr-proxy.soliddowant.dev
spec:
  group: ghcr-proxy.soliddowant.dev
  names:
    kind: GHCRAccessPolicy
    listKind: GHCRAccessPolicyList
    plural: ghcraccesspolicies
    shortNames:
    - gap
    singular: ghcraccesspolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GHCRAccessPolicy lets ServiceAccounts of its namespace pull, push or delete GHCR repositories through the proxy,
          within the grant the proxy's configuration gives the namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GHCRAccessPolicySpec says which ServiceAccounts of this namespace
              may do what on which repositories.
            properties:
              rules:
                description: Rules allow actions on repositories. Policies only ever
                  add access.
                items:
                  description: AccessRule allows some actions on the repositories
                    its patterns match.
                  properties:
                    actions:
                      description: Actions allowed on those repositories.
                      items:
                        description: Action is a registry action a rule allows.
                        enum:
                        - pull
                        - push
                        - delete
                        type: string
                      maxItems: 3
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    repositories:
                      description: |-
                        Repositories are glob patterns of repository names, without the registry host. `*` matches within one path
                        segment and `**` matches any number of whole segments.
                      items:
                        maxLength: 255
                        minLength: 1
                        type: string
                      maxItems: 32
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                      x-kubernetes-validations:
                      - message: each repository pattern must be lower-case segments
                          of [a-z0-9._-] and *, separated by /, with ** only as a
                          whole segment
                        rule: self.all(p, p.matches('^(\\*\\*|\\*|\\*?([a-z0-9._-]+\\*?)+)(/(\\*\\*|\\*|\\*?([a-z0-9._-]+\\*?)+))*$'))
                  required:
                  - actions
                  - repositories
                  type: object
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              serviceAccounts:
                description: ServiceAccounts in this namespace this policy applies
                  to.
                items:
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
            required:
            - rules
            - serviceAccounts
            type: object
          status:
            description: GHCRAccessPolicyStatus is the observed state of a GHCRAccessPolicy.
              Only the proxy writes it.
            properties:
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last generation the proxy computed
                  this status for.
                format: int64
                type: integer
              rejected:
                description: Rejected lists each repository pattern that lost actions,
                  with the actions it lost and why.
                items:
                  description: |-
                    RejectedRule is one repository pattern of one rule that lost at least one action. The lost actions are ignored;
                    the rest of the policy still applies.
                  properties:
                    actions:
                      description: Actions are the actions dropped for this pattern,
                        counting the pull that push and delete imply.
                      items:
                        description: Action is a registry action a rule allows.
                        enum:
                        - pull
                        - push
                        - delete
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    reason:
                      description: Reason says why the actions were dropped.
                      enum:
                      - OutsideGrant
                      - InvalidPattern
                      - NoGrant
                      type: string
                    repository:
                      description: Repository is the pattern as written in the rule.
                      type: string
                    rule:
                      description: Rule is the index into spec.rules.
                      format: int32
                      type: integer
                  required:
                  - actions
                  - reason
                  - repository
                  - rule
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
