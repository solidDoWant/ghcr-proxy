# Generated by scripts/ci/tekton-generate.sh from scripts/ci/tekton-pipelinerun.yaml.tmpl. Do not edit.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  # A fixed name collides with the previous run, which Pipelines-as-Code keeps.
  generateName: registrygate-pull-request-
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request" && target_branch == "master"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  timeouts:
    pipeline: 1h
  workspaces:
    # Shared by the step and dockerd at the same path, so stage containers
    # can mount the checkout.
    - name: source
      emptyDir: {}
    - name: guard
      emptyDir: {}
  taskRunSpecs:
    # Every stage runs inside the dind sidecar's cgroup, so its memory is the
    # memory of all stages together: the sum of their cold-cache peaks plus
    # dockerd. No CPU limit: a kata VM's CPU request only places the pod and
    # sets its share.
    - pipelineTaskName: ci
      sidecarSpecs:
        - name: dind
          computeResources:
            requests:
              cpu: "8"
              memory: 14Gi
            limits:
              memory: 14Gi
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
      - name: guard
    tasks:
      - name: ci
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: docker
            - name: namespace
              value: ci-tekton
        params:
          - name: script
            value: |
              set -eu
              mkdir src
              cd src
              git init -q .
              git remote add origin "$(params.repo_url)"
              # The full history: the change rules need the merge base with
              # master, and `make test` runs the test guard's tests over it.
              git fetch -q origin '+refs/heads/master:refs/remotes/origin/master' "$(params.revision)"
              git checkout -q --detach "$(params.revision)"
              # Test the PR merged with master, as actions/checkout does.
              if ! git -c user.email=ci@ci -c user.name=ci merge -q --no-ff --no-edit origin/master; then
                echo "the pull request conflicts with master; rebase it:" >&2
                git diff --name-only --diff-filter=U >&2
                exit 1
              fi
              exec ./scripts/ci/stages.sh pull_request
        workspaces:
          - name: source
            workspace: source
      - name: test-guard
        workspaces:
          - name: guard
            workspace: guard
        taskSpec:
          workspaces:
            - name: guard
              mountPath: /workspace/guard
          steps:
            # Reads the labels when the run starts, so a /retest after the
            # owner adds test-removal-approved picks it up. The only step with
            # the token: it runs this script and nothing from the repository.
            - name: labels
              image: mirror.gcr.io/library/python:3.14.9@sha256:30a34d141e34b8fbedabecb8f86b3d49a62e348d8112ad3c1289f0b2b216ad3e
              computeResources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 256Mi
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: "{{ git_auth_secret }}"
                      key: git-provider-token
              script: |
                #!/usr/bin/env python3
                import json, os, urllib.request
                request = urllib.request.Request(
                    "https://api.github.com/repos/{{ repo_owner }}/{{ repo_name }}/issues/{{ pull_request_number }}/labels?per_page=100",
                    headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json"},
                )
                with urllib.request.urlopen(request, timeout=30) as response:
                    labels = [label["name"] for label in json.load(response)]
                with open("/workspace/guard/labels", "w") as out:
                    out.write(",".join(labels))
                print("labels:", ",".join(labels))
            # No token from here on.
            - name: guard
              image: mirror.gcr.io/library/python:3.14.9@sha256:30a34d141e34b8fbedabecb8f86b3d49a62e348d8112ad3c1289f0b2b216ad3e
              computeResources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 256Mi
              script: |
                #!/bin/sh
                set -eu
                mkdir /workspace/guard/src
                cd /workspace/guard/src
                git init -q .
                git remote add origin "$(params.repo_url)"
                git fetch -q origin '+refs/heads/master:refs/remotes/origin/master' "$(params.revision)"
                git checkout -q --detach "$(params.revision)"
                TEST_GUARD_PR_LABELS=$(cat /workspace/guard/labels) make test-guard
